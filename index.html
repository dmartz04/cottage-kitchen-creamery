<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantry Nice Cream Co. | Premium 60-Second Dairy-Free Soft Serve</title>
    <style>
        :root {
            --primary: #FF5A70;      /* Vibrant Strawberry Coral */
            --accent: #FFD2D7;       /* Soft Pink Tint */
            --dark: #23262F;         /* Premium Warm Charcoal */
            --text-muted: #64748B;   /* Slate Gray for body */
            --bg-cream: #FAF9F5;     /* Warm Organic Off-White Background */
            --white: #FFFFFF;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: var(--font-stack);
            -webkit-font-smoothing: antialiased;
        }

        body { 
            background-color: var(--bg-cream); 
            color: var(--dark); 
            line-height: 1.5; 
        }

        /* Utility Layouts */
        .container { 
            max-width: 1100px; 
            margin: 0 auto; 
            padding: 0 1.5rem; 
        }

        /* Clean Navigation Header */
        header { 
            background: var(--white); 
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.95);
        }
        
        .header-container {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            height: 70px;
        }

        .logo { 
            font-size: 1.25rem; 
            font-weight: 800; 
            letter-spacing: -0.5px;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        nav { display: flex; gap: 2rem; }
        nav a { 
            text-decoration: none; 
            color: var(--dark); 
            font-weight: 600; 
            font-size: 0.95rem;
            cursor: pointer; 
            transition: color 0.2s;
            padding: 0.5rem 0;
        }
        nav a:hover, nav a.active { color: var(--primary); }

        /* Premium Buttons */
        .btn { 
            display: inline-flex; 
            align-items: center;
            justify-content: center;
            background: var(--dark); 
            color: var(--white); 
            padding: 0.9rem 2rem; 
            border: none; 
            border-radius: 50px; 
            font-weight: 700; 
            font-size: 1rem;
            cursor: pointer; 
            text-decoration: none; 
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(35, 38, 47, 0.12);
        }
        .btn:hover { 
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(35, 38, 47, 0.18);
        }
        .btn-primary {
            background: var(--primary);
            box-shadow: 0 4px 12px rgba(255, 90, 112, 0.2);
        }
        .btn-primary:hover {
            background: #E04359;
            box-shadow: 0 6px 20px rgba(255, 90, 112, 0.3);
        }

        /* Section Controller */
        .tab-content { display: none; padding: 3rem 0 5rem; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* HERO SECTION */
        .hero { 
            text-align: center; 
            padding: 5rem 1rem 4rem; 
            max-width: 800px;
            margin: 0 auto;
        }
        .badge {
            background: var(--accent);
            color: var(--primary);
            padding: 0.35rem 1rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 1.5rem;
        }
        .hero h1 { 
            font-size: 3.5rem; 
            line-height: 1.15;
            font-weight: 800;
            letter-spacing: -1.5px;
            color: var(--dark); 
            margin-bottom: 1.5rem; 
        }
        .hero p { 
            font-size: 1.25rem; 
            color: var(--text-muted); 
            margin-bottom: 2.5rem; 
            font-weight: 400;
        }

        /* VALUE PROPOSITION GRID */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 2rem; 
            margin-top: 1rem; 
        }
        .card { 
            background: var(--white); 
            padding: 2.5rem; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.02); 
            border: 1px solid rgba(0,0,0,0.03);
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-4px); }
        .card h3 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.75rem; letter-spacing: -0.3px; }
        .card p { color: var(--text-muted); font-size: 1rem; }
        .card-icon { font-size: 2rem; margin-bottom: 1rem; display: block; }

        /* SHOP/ORDER GRID */
        .product-card {
            background: var(--white);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            border: 1px solid rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-image-placeholder {
            background: var(--bg-cream);
            height: 240px;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
        }
        .product-details h3 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .product-details p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem; }
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        .price { font-size: 1.75rem; font-weight: 800; color: var(--dark); }

        /* SIGNUP / CONTACT FORM LAYOUT */
        .form-wrapper {
            background: var(--white);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.02);
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid rgba(0,0,0,0.03);
        }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem; }
        .form-group label { font-weight: 700; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }
        input, textarea { 
            padding: 1rem; 
            border: 2px solid #E2E8F0; 
            border-radius: 12px; 
            font-size: 1rem; 
            color: var(--dark);
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus { border-color: var(--primary); outline: none; }

        /* DIALOG POPUP MODAL (SMOKE TEST ENGINE) */
        .modal-overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(35, 38, 47, 0.6); 
            backdrop-filter: blur(4px);
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
        }
        .modal { 
            background: var(--white); 
            padding: 3.5rem 2.5rem 3rem; 
            border-radius: 28px; 
            max-width: 480px; 
            width: 90%; 
            text-align: center; 
            position: relative; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalPop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal h2 { font-size: 2rem; font-weight: 800; color: #FF4757; margin-bottom: 1rem; letter-spacing: -0.5px; }
        .modal-close { position: absolute; top: 1.5rem; right: 1.5rem; font-size: 1.75rem; cursor: pointer; border: none; background: none; color: var(--text-muted); }
        
        /* FOOTER BRANDING */
        footer {
            background: var(--white);
            padding: 4rem 0;
            border-top: 1px solid rgba(0,0,0,0.06);
            margin-top: 4rem;
            text-align: center;
        }
        .footer-logo { font-size: 1.1rem; font-weight: 700; color: var(--dark); margin-bottom: 1rem; }
        .footer-text { font-size: 0.9rem; color: var(--text-muted); }

        /* Responsive scaling adjustments */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.25rem; }
            nav { display: none; } /* Kept clean for single-page utility on mobile */
            .header-container { justify-content: center; }
            .form-wrapper { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation Shell -->
    <header>
        <div class="container header-container">
            <div class="logo">🍦 cottage kitchen creamery</div>
            <nav>
                <a onclick="switchTab('home')" id="nav-home" class="active">Home Base</a>
                <a onclick="switchTab('order')" id="nav-order">Shop Bundles</a>
                <a onclick="switchTab('contact')" id="nav-contact">Flavor Waitlist</a>
            </nav>
        </div>
    </header>

    <main class="container">
